name: Void Linux for Xiaomi Pad 6 (pipa)

on:
  push:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * 5' # Every Friday

env:
  ROOTFS_URI: "https://repo-fi.voidlinux.org/live/current/void-aarch64-ROOTFS-20250202.tar.xz"
  QEMU_URI: "https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-aarch64-static"
  XBPS_URI: "https://repo-fi.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz"
  REPO: "https://repo-fi.voidlinux.org/voidlinux/current/aarch64"
  PACKAGES: "pipa-metapkg pipa-bt-quirk qbootctl"
  PACKAGES_BUILD: "pipa-metapkg pipa-bt-quirk pipa-sensors qbootctl"
  WORKDIR: "workdir"
  OUTDIR: "out"

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Build custom xbps packages
  # ──────────────────────────────────────────────
  build-packages:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set current date
      run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

    - name: Download xbps-static
      run: |
        mkdir -p $WORKDIR/xbps-static
        wget -q "$XBPS_URI" -O $WORKDIR/xbps-static.tar.xz
        tar xf $WORKDIR/xbps-static.tar.xz -C $WORKDIR/xbps-static

    - name: Clone void-packages & custom_repo
      run: |
        git clone https://github.com/void-linux/void-packages --depth=1 $WORKDIR/void-packages
        git clone https://github.com/userg0d/custom_repo --depth=1 $WORKDIR/custom_repo

    - name: Copy package templates
      run: |
        cp -r packages/* $WORKDIR/void-packages/srcpkgs/
        cp -r $WORKDIR/custom_repo/srcpkgs/* $WORKDIR/void-packages/srcpkgs/

    - name: Build packages
      run: |
        export PATH=$(realpath $WORKDIR/xbps-static/usr/bin):$PATH
        cd $WORKDIR/void-packages
        echo "XBPS_CHROOT_CMD=ethereal" >> etc/conf
        echo "XBPS_ALLOW_CHROOT_BREAKOUT=yes" >> etc/conf
        ./xbps-src binary-bootstrap
        for PACKAGE in $PACKAGES_BUILD; do
          echo "::group::Building $PACKAGE"
          ./xbps-src -a aarch64 pkg "$PACKAGE"
          echo "::endgroup::"
        done
        mkdir -p ../repo
        cp -rv hostdir/binpkgs/* ../repo

    - name: Upload repo artifact
      uses: actions/upload-artifact@v4
      with:
        name: xbps-repo
        path: ${{ env.WORKDIR }}/repo/
        retention-days: 1

  # ──────────────────────────────────────────────
  # Stage 2: Build base rootfs image
  # ──────────────────────────────────────────────
  build-base:
    needs: build-packages
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set current date
      run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-libsparse-utils qemu-user-static

    - name: Download rootfs & qemu
      run: |
        mkdir -p $WORKDIR $OUTDIR
        wget -q "$ROOTFS_URI" -O $WORKDIR/rootfs.tar.xz
        wget -q "$QEMU_URI" -O $WORKDIR/qemu-aarch64-static
        chmod +x $WORKDIR/qemu-aarch64-static

    - name: Download repo artifact
      uses: actions/download-artifact@v4
      with:
        name: xbps-repo
        path: ${{ env.WORKDIR }}/repo

    - name: Setup binfmt_misc
      run: |
        sudo modprobe binfmt_misc
        sudo mount binfmt_misc /proc/sys/fs/binfmt_misc -t binfmt_misc 2>/dev/null || true
        echo ':aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7:\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register || true
        echo ':aarch64ld:M::\x7fELF\x02\x01\x01\x03\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\xb7:\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register || true

    - name: Create and mount base image
      run: |
        cd $WORKDIR
        truncate -s 4G linux.img
        mkfs.ext4 linux.img
        mkdir -p rootfs_mountpoint
        sudo mount linux.img rootfs_mountpoint
        sudo tar xf rootfs.tar.xz -C rootfs_mountpoint
        sudo install -m755 qemu-aarch64-static rootfs_mountpoint/

    - name: Bind-mount host filesystems
      run: |
        cd $WORKDIR
        sudo mount --bind /dev rootfs_mountpoint/dev
        sudo mount --bind /dev/pts rootfs_mountpoint/dev/pts
        sudo mount --bind /proc rootfs_mountpoint/proc
        sudo mount --bind /sys rootfs_mountpoint/sys

    - name: Configure base system
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint

        # Hostname & networking
        echo "xiaomi-pad-6" | sudo tee $MP/etc/hostname
        echo "nameserver 1.1.1.1" | sudo tee $MP/etc/resolv.conf

        # fstab
        uuid=$(blkid -o value linux.img | head -n 1)
        echo "UUID=$uuid / ext4 defaults 0 0" | sudo tee -a $MP/etc/fstab

        # Kernel cmdline
        echo "root=UUID=$uuid noquiet loglevel=2 console=tty0 earlycon=tty0 keep_bootcon fbcon=rotate:1 fbcon=font:VGA8x16 rw" | sudo tee $MP/etc/cmdline

        # Users
        sudo chroot $MP useradd -m -g users -G wheel user
        sudo chroot $MP bash -c "echo 'root:root' | chpasswd"
        sudo chroot $MP bash -c "echo 'user:1' | chpasswd"
        echo "%wheel ALL=(ALL:ALL) ALL" | sudo tee $MP/etc/sudoers.d/wheel

    - name: Install base packages
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP xbps-install -Syu xbps
        sudo chroot $MP xbps-install -Syuv
        sudo chroot $MP xbps-install -Sy NetworkManager chrony fake-hwclock nano

    - name: Install zzz CPU control hook
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo mkdir -p $MP/etc/zzz.d
        sudo install -m755 ../config/zzz/99-cpu-control.sh $MP/etc/zzz.d/99-cpu-control.sh

    - name: Enable base services
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/dbus /etc/runit/runsvdir/default"
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/NetworkManager /etc/runit/runsvdir/default"
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/chronyd /etc/runit/runsvdir/default"

    - name: Install custom packages from repo
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo mkdir -p $MP/repo
        sudo mount --bind repo $MP/repo
        sudo chroot $MP xbps-install -y --repository /repo $PACKAGES
        sudo umount $MP/repo
        sudo rm -rf $MP/repo

    - name: Extract boot image & finalize base
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo cp $MP/boot/boot-*.img ../$OUTDIR/boot.img
        sudo rm $MP/qemu-aarch64-static
        sudo umount -R $MP
        img2simg linux.img ../$OUTDIR/void_base.img

    - name: Upload base image artifacts
      uses: actions/upload-artifact@v4
      with:
        name: void-base_${{ env.CURRENT_DATE }}
        path: |
          out/boot.img
          out/void_base.img
        retention-days: 7

    - name: Upload raw linux.img for DE builds
      uses: actions/upload-artifact@v4
      with:
        name: linux-img-raw
        path: |
          ${{ env.WORKDIR }}/linux.img
          ${{ env.WORKDIR }}/qemu-aarch64-static
        retention-days: 1

  # ──────────────────────────────────────────────
  # Stage 3: Build GNOME image (on top of base)
  # ──────────────────────────────────────────────
  build-gnome:
    needs: build-base
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set current date
      run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-libsparse-utils qemu-user-static

    - name: Download raw base image
      uses: actions/download-artifact@v4
      with:
        name: linux-img-raw
        path: ${{ env.WORKDIR }}

    - name: Download repo artifact
      uses: actions/download-artifact@v4
      with:
        name: xbps-repo
        path: ${{ env.WORKDIR }}/repo

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    - name: Setup binfmt_misc
      run: |
        sudo modprobe binfmt_misc
        sudo mount binfmt_misc /proc/sys/fs/binfmt_misc -t binfmt_misc 2>/dev/null || true
        echo ':aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7:\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register || true
        echo ':aarch64ld:M::\x7fELF\x02\x01\x01\x03\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\xb7:\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register || true

    - name: Prepare GNOME image
      run: |
        cd $WORKDIR
        cp linux.img linux_gnome.img
        e2fsck -f -y linux_gnome.img
        resize2fs linux_gnome.img 8G
        mkdir -p rootfs_mountpoint
        sudo mount linux_gnome.img rootfs_mountpoint
        sudo install -m755 qemu-aarch64-static rootfs_mountpoint/
        sudo mount --bind /dev rootfs_mountpoint/dev
        sudo mount --bind /dev/pts rootfs_mountpoint/dev/pts
        sudo mount --bind /proc rootfs_mountpoint/proc
        sudo mount --bind /sys rootfs_mountpoint/sys

    - name: Install GNOME packages
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP xbps-install -Suy gnome-core gnome-console firefox gdm mesa-freedreno-dri pipewire bluez libspa-bluetooth xdg-desktop-portal-gtk pulseaudio

    - name: Install custom packages from repo (GNOME)
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo mkdir -p $MP/repo
        sudo mount --bind repo $MP/repo
        sudo chroot $MP xbps-install -y --repository /repo $PACKAGES
        sudo umount $MP/repo
        sudo rm -rf $MP/repo

    - name: Enable GNOME services
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/gdm /etc/runit/runsvdir/default"
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/bluetoothd /etc/runit/runsvdir/default"
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/pipa-bt-quirk /etc/runit/runsvdir/default"
        sudo chroot $MP /sbin/usermod -aG audio,video,bluetooth user

    - name: Finalize GNOME image
      run: |
        cd $WORKDIR
        mkdir -p ../$OUTDIR
        sudo rm rootfs_mountpoint/qemu-aarch64-static
        sudo umount -R rootfs_mountpoint
        img2simg linux_gnome.img ../$OUTDIR/void_gnome.img

    - name: Upload GNOME image
      uses: actions/upload-artifact@v4
      with:
        name: void-gnome_${{ env.CURRENT_DATE }}
        path: out/void_gnome.img
        retention-days: 7

  # ──────────────────────────────────────────────
  # Stage 4: Build KDE image (on top of base)
  # ──────────────────────────────────────────────
  build-kde:
    needs: build-base
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set current date
      run: echo "CURRENT_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y android-sdk-libsparse-utils qemu-user-static

    - name: Download raw base image
      uses: actions/download-artifact@v4
      with:
        name: linux-img-raw
        path: ${{ env.WORKDIR }}

    - name: Download repo artifact
      uses: actions/download-artifact@v4
      with:
        name: xbps-repo
        path: ${{ env.WORKDIR }}/repo

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h

    - name: Setup binfmt_misc
      run: |
        sudo modprobe binfmt_misc
        sudo mount binfmt_misc /proc/sys/fs/binfmt_misc -t binfmt_misc 2>/dev/null || true
        echo ':aarch64:M::\x7fELF\x02\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\xb7:\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register || true
        echo ':aarch64ld:M::\x7fELF\x02\x01\x01\x03\x00\x00\x00\x00\x00\x00\x00\x00\x03\x00\xb7:\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff:/qemu-aarch64-static:' | sudo tee /proc/sys/fs/binfmt_misc/register || true

    - name: Prepare KDE image
      run: |
        cd $WORKDIR
        cp linux.img linux_kde.img
        e2fsck -f -y linux_kde.img
        resize2fs linux_kde.img 8G
        mkdir -p rootfs_mountpoint
        sudo mount linux_kde.img rootfs_mountpoint
        sudo install -m755 qemu-aarch64-static rootfs_mountpoint/
        sudo mount --bind /dev rootfs_mountpoint/dev
        sudo mount --bind /dev/pts rootfs_mountpoint/dev/pts
        sudo mount --bind /proc rootfs_mountpoint/proc
        sudo mount --bind /sys rootfs_mountpoint/sys

    - name: Install KDE packages
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP xbps-install -Suy kde-plasma konsole sddm mesa-freedreno-dri maliit-keyboard pipewire bluez libspa-bluetooth xdg-desktop-portal-kde pulseaudio

    - name: Install custom packages from repo (KDE)
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo mkdir -p $MP/repo
        sudo mount --bind repo $MP/repo
        sudo chroot $MP xbps-install -y --repository /repo $PACKAGES
        sudo umount $MP/repo
        sudo rm -rf $MP/repo

    - name: Configure SDDM
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP touch /etc/sddm.conf
        sudo chroot $MP mkdir -p /etc/sddm.conf.d/
        sudo cp config/kde/sddm/10-wayland.conf $MP/etc/sddm.conf.d/
        sudo cp config/kde/sddm/50-theme.conf $MP/etc/sddm.conf.d/

    - name: Enable KDE services
      run: |
        cd $WORKDIR
        MP=rootfs_mountpoint
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/sddm /etc/runit/runsvdir/default"
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/bluetoothd /etc/runit/runsvdir/default"
        sudo chroot $MP /bin/bash -c "ln -sv /etc/sv/pipa-bt-quirk /etc/runit/runsvdir/default"
        sudo chroot $MP /sbin/usermod -aG audio,video,bluetooth user

    - name: Finalize KDE image
      run: |
        cd $WORKDIR
        mkdir -p ../$OUTDIR
        sudo rm rootfs_mountpoint/qemu-aarch64-static
        sudo umount -R rootfs_mountpoint
        img2simg linux_kde.img ../$OUTDIR/void_kde.img

    - name: Upload KDE image
      uses: actions/upload-artifact@v4
      with:
        name: void-kde_${{ env.CURRENT_DATE }}
        path: out/void_kde.img
        retention-days: 7
